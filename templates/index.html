<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PassCheck AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="background"></div>

<div class="container">
    <div class="logo">🔐</div>
    <h1>PassCheck AI</h1>
    <p class="subtitle">Check whether your password passes our test</p>

    <form method="POST" autocomplete="off">
        <div class="password-box">
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >
            <button
                type="button"
                class="toggle-btn"
                id="toggleBtn"
                onclick="togglePassword()"
                aria-label="Toggle password visibility">
                👁
            </button>
        </div>

        <button type="submit" class="analyze-btn">
            Analyze Password
        </button>
    </form>

    {% if result %}
    <div class="result-card" data-strength="{{ strength_slug }}">        
        <span class="result-label">Analysis Result</span>
        <h2>{{ result }}</h2>

        <div class="meter">
            <div class="meter-fill" style="width: {{ confidence }}%;"></div>
        </div>

        <div class="confidence-wrapper">
            <div class="confidence">{{ confidence }}%</div>
            <span class="confidence-label">Model Confidence</span>
        </div>

        <div class="stats">
            <div class="stat">
                <span class="stat-icon">🤖</span>
                <span class="stat-text">ML Prediction</span>
            </div>
            <div class="stat">
                <span class="stat-icon">🛡️</span>
                <span class="stat-text">Security Check</span>
            </div>
            <div class="stat">
                <span class="stat-icon">⚡</span>
                <span class="stat-text">Instant Analysis</span>
            </div>
        </div>
    </div>
    {% endif %}
</div>

<script>
function togglePassword() {
    const input = document.getElementById("password");
    const btn = document.getElementById("toggleBtn");
    
    if (input.type === "password") {
        input.type = "text";
        btn.textContent = "🙈";
    } else {
        input.type = "password";
        btn.textContent = "👁";
    }
}
</script>

</body>
</html>
